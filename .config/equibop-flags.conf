# Native Wayland + PipeWire capture (needed for Niri screen share)
--ozone-platform=wayland
--enable-features=WebRTCPipeWireCapturer,WaylandWindowDecorations
# Fixes corrupt / stuttery Wayland screenshare buffers on Electron
--disable-gpu-memory-buffer-video-frames
# Avoid AMD VA-API encoder paths that break multi-viewer Go Live renegotiation
--disable-features=VaapiVideoEncoder,VaapiVideoDecoder,HardwareMediaKeyHandling
