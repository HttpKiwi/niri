background_opacity 0.85
wayland_enable_blur yes
include ~/.cache/ags/user/generated/kitty-colors.conf
# Shell
shell           fish

font_family Geist Mono
bold_font Geist Mono Bold
italic_font Geist Mono Italic
bold_italic_font Geist Mono Bold Italic
font_size 13

# Behaviour
window_padding_width 2
cursor_trail 1
hide_window_decorations yes
confirm_os_window_close 0
allow_remote_control yes
listen_on unix:/run/user/1000/kitty

